apiVersion: apps/v1
kind: Deployment
metadata:
  name: docloom-backend
  labels:
    app: docloom-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: docloom-backend
  template:
    metadata:
      labels:
        app: docloom-backend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docloom-backend
          # 逻辑名,由 overlays/staging 的 images 改写为
          # localhost:5000/docloom-backend:<tag>;实际 tag 由 image-updater 在线覆盖
          image: docloom-backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          # TCP 探针:只看端口是否起来,规避 actuator 可能被 sa-token 拦截的问题
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
