apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docloom-backend-staging
  namespace: argocd
spec:
  project: default
  source:
    # 单仓库 GitOps:Argo 只读 deploy/staging 分支(部署状态分支)的 staging overlay。
    # master(代码)保持干净,部署 tag 提交只进 deploy/staging。
    repoURL: https://github.com/Mr-AppleDog/DocLoom.git
    targetRevision: deploy/staging
    path: deploy/gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: docloom
  syncPolicy:
    automated:
      prune: false        # 起步不删资源
      selfHeal: true      # 集群漂移自动回到期望态
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
